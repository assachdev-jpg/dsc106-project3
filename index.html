<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where Will Warm the Fastest?</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <h1>Where Will Warm the Fastest?</h1>
  <p class="subtitle">Surface air temperature change compared to 1850-1900, averaged over each decade on a 5° grid. Data: CMIP6, GFDL-ESM4 model.</p>

  <div class="controls">
    <div class="toggle" role="group" aria-label="Emissions scenario">
      <button data-scenario="ssp126">Low emissions (SSP1-2.6)</button>
      <button data-scenario="ssp585" class="active">High emissions (SSP5-8.5)</button>
    </div>
    <label class="slider">
      Decade: <strong id="decade-label">2090s</strong>
      <input id="decade" type="range" min="1850" max="2090" step="10" value="2090">
    </label>
  </div>

  <div id="map"></div>
  <div id="legend"></div>
  <div id="tooltip" hidden></div>
</body>
</html>
